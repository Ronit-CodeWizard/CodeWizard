<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Minimal CAT Loader</title>

<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    min-height: 100dvh;
    background: #ffffff;
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Open Sans', sans-serif;
  }

  .loader {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .loader img {
    width: clamp(100px, 35vw, 200px);
    height: auto;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  .row {
    position: absolute;
    top: calc(50% + 120px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: clamp(14px, 3.5vw, 20px);
  }

  .handle {
    font-weight: 700;
  }

  .heart, .github {
    cursor: pointer;
    transition: transform .2s;
  }

  .heart:hover, .github:hover {
    transform: scale(1.2);
  }
</style>

</head>
<body>

<div class="loader">
  <img src="https://i.supaimg.com/92f82b8e-0941-4720-9455-b7257d1262f2/ac83b436-141b-46ec-814e-016ec02a9cb5.gif" draggable="false">
</div>

<div class="row">
  <span class="handle">@CodeWizard</span>
  <i class="fa-regular fa-heart heart"></i>
  <i class="fa-brands fa-github github"></i>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Glass Navigation - CodeWizard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="mesh" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
  </div>

  <nav class="liquid-nav" id="nav" aria-label="Primary">

    <div class="liquid-glare-container" aria-hidden="true">
      <div class="liquid-glare" id="glare"></div>
    </div>

    <div class="tabs" id="tabs" role="tablist" aria-label="Sections">

      <span class="active-pill" id="activePill"></span>

      <button class="tab" role="tab" aria-selected="true" tabindex="0" data-panel="home">
        <span class="icon" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24"
            fill="none" stroke="currentColor"
            stroke-linecap="round" stroke-linejoin="round">

            <path d="M3 9.5 12 3l9 6.5"/>
            <path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>
          </svg>
        </span>

        <span>Home</span>
      </button>

      <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-panel="search">
        <span class="icon" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24"
            fill="none" stroke="currentColor"
            stroke-linecap="round" stroke-linejoin="round">

            <circle cx="11" cy="11" r="7"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
        </span>

        <span>Search</span>
      </button>

      <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-panel="messages">
        <span class="icon" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24"
            fill="none" stroke="currentColor"
            stroke-linecap="round" stroke-linejoin="round">

            <path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </span>

        <span>Messages</span>
      </button>

    </div>

    <div class="divider" role="separator" aria-orientation="vertical"></div>

    <button class="theme-toggle" id="themeToggle" aria-pressed="false">

      <span class="icon-stack" aria-hidden="true">

        <svg class="icon-sun" width="19" height="19"
          viewBox="0 0 24 24"
          fill="none" stroke="currentColor"
          stroke-linecap="round" stroke-linejoin="round">

          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
        </svg>

        <svg class="icon-moon" width="19" height="19"
          viewBox="0 0 24 24"
          fill="none" stroke="currentColor"
          stroke-linecap="round" stroke-linejoin="round">

          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>

      </span>

      <span class="sr-only">Toggle dark mode</span>

    </button>

  </nav>

  <script>
    (() => {

      const nav = document.getElementById('nav');
      const tabsEl = document.getElementById('tabs');
      const tabs = Array.from(tabsEl.querySelectorAll('.tab'));
      const activePill = document.getElementById('activePill');
      const glare = document.getElementById('glare');
      const themeToggle = document.getElementById('themeToggle');

      const reduceMotion =
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;


      /* ---------- Pill positioning ---------- */

      function movePill(btn, animate = true) {

        activePill.style.transition = animate
          ? 'transform 0.5s cubic-bezier(0.34, 1.4, 0.64, 1), width 0.5s cubic-bezier(0.34, 1.4, 0.64, 1)'
          : 'none';

        activePill.style.width = btn.offsetWidth + 'px';

        activePill.style.transform =
          `translateX(${btn.offsetLeft}px)`;
      }


      function selectTab(btn, { focus = false } = {}) {

        tabs.forEach(t => {
          t.setAttribute('aria-selected', 'false');
          t.tabIndex = -1;
        });

        btn.setAttribute('aria-selected', 'true');
        btn.tabIndex = 0;

        movePill(btn);

        if (focus) {
          btn.focus();
        }
      }


      tabs.forEach(btn => {

        btn.addEventListener('click', () => {
          selectTab(btn);
        });

      });


      /* ---------- Keyboard navigation ---------- */

      tabsEl.addEventListener('keydown', (e) => {

        const current =
          tabs.findIndex(
            t => t.getAttribute('aria-selected') === 'true'
          );

        let next = null;

        if (e.key === 'ArrowRight') {
          next = (current + 1) % tabs.length;
        }

        else if (e.key === 'ArrowLeft') {
          next = (current - 1 + tabs.length) % tabs.length;
        }

        else if (e.key === 'Home') {
          next = 0;
        }

        else if (e.key === 'End') {
          next = tabs.length - 1;
        }

        if (next !== null) {

          e.preventDefault();

          selectTab(tabs[next], {
            focus: true
          });

        }

      });


      /* ---------- Initial pill position ---------- */

      window.addEventListener('load', () => {

        const initial =
          tabs.find(
            t => t.getAttribute('aria-selected') === 'true'
          );

        movePill(initial, false);

        void activePill.offsetWidth;

      });


      /* ---------- Resize ---------- */

      window.addEventListener('resize', () => {

        const current =
          tabs.find(
            t => t.getAttribute('aria-selected') === 'true'
          );

        movePill(current, false);

      });


      /* ---------- Interactive glare ---------- */

      if (!reduceMotion) {

        nav.addEventListener('mousemove', (e) => {

          const rect = nav.getBoundingClientRect();

          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          glare.style.setProperty('--x', x + 'px');
          glare.style.setProperty('--y', y + 'px');

        });

      }


      /* ---------- Theme toggle ---------- */

      const root = document.documentElement;

      const prefersDark =
        window.matchMedia('(prefers-color-scheme: dark)').matches;


      if (prefersDark) {

        root.setAttribute('data-theme', 'dark');

        themeToggle.setAttribute(
          'aria-pressed',
          'true'
        );

      }


      themeToggle.addEventListener('click', () => {

        const isDark =
          root.getAttribute('data-theme') === 'dark';

        root.setAttribute(
          'data-theme',
          isDark ? 'light' : 'dark'
        );

        themeToggle.setAttribute(
          'aria-pressed',
          String(!isDark)
        );


        setTimeout(() => {

          const current =
            tabs.find(
              t => t.getAttribute('aria-selected') === 'true'
            );

          movePill(current, false);

        }, 50);

      });

    })();
  </script>

</body>
  </html>
